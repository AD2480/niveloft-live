# Niveloft backend configuration (the code keeps its original package name, dev.projectflow).
# Secrets and machine-specific values come from environment variables; the
# defaults below are for local development only. See .env.example.

server:
  # Hosts such as Railway and Render tell the app which port to use through PORT.
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: never
  # Finish requests in flight before stopping (deploys, restarts).
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    # A client that stops sending mid-request is dropped after this.
    connection-timeout: 20s
    max-http-form-post-size: 1MB
    # Oversized uploads are refused without reading them to the end.
    max-swallow-size: 60MB
    threads:
      max: ${SERVER_THREADS:200}

spring:
  application:
    name: projectflow
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/projectflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:projectflow}
    password: ${DB_PASSWORD:projectflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Waiting longer than this for a free connection fails fast with "server busy" (503).
      connection-timeout: 10000
      validation-timeout: 3000
  # No database transaction may run longer than this.
  transaction:
    default-timeout: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none              # Flyway owns the schema (see db/migration)
    properties:
      hibernate:
        default_batch_fetch_size: 100   # loads lazy collections (criteria, checklists) in batches
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
      # Any single query that runs longer than this (ms) is stopped.
      jakarta.persistence.query.timeout: 15000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness (the app is running) and /readiness (it can serve: database up).
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # Every log line carries the request id (also sent as X-Request-Id and in error bodies).
    level: "%5p [%X{requestId:-}]"
  level:
    projectflow.requests: INFO
    projectflow.browser: WARN

springdoc:
  # API docs are off unless API_DOCS_ENABLED=true (turn them on for local development, not production).
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}

projectflow:
  # IANA time zone used to decide what "today" and "overdue" mean.
  zone: ${PROJECTFLOW_ZONE:UTC}
  jwt:
    # Base64-encoded key of at least 32 bytes. REQUIRED outside local development:
    #   openssl rand -base64 48
    secret: ${JWT_SECRET:ZGV2LW9ubHktcHJvamVjdGZsb3ctc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nLTEyMzQ1Ng==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    # The Vite dev server proxies /api, so CORS is only needed if you call the API directly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  storage:
    # Uploaded evidence files are stored here (outside the web root).
    directory: ${STORAGE_DIR:./data/uploads}
  demo-data:
    # Seed sample users, projects and tasks into an empty database. Off: the live site starts empty.
    # Turn on (DEMO_DATA=true) only for local development; the sample accounts' password is public.
    enabled: ${DEMO_DATA:false}
  site:
    # The frontend's public address. Links in emails point here. Set it in production
    # (e.g. https://projectflow.vercel.app, no trailing slash).
    url: ${APP_URL:http://localhost:5174}
    name: ${SITE_NAME:Niveloft}
    # Shown at the bottom of emails; contact messages and "payment to check" emails go here.
    contact-email: ${CONTACT_EMAIL:dobhalaaryam@gmail.com}
  email:
    # none (nothing sent), log (written to this server's log, for local testing) or resend.
    provider: ${EMAIL_PROVIDER:none}
    # Resend API key (starts with re_). Server-side only.
    api-key: ${EMAIL_API_KEY:}
    # Must be an address on a domain you verified in Resend, e.g. "Niveloft <no-reply@yourdomain.com>".
    # onboarding@resend.dev only delivers to your own Resend account's address (for testing).
    from: ${EMAIL_FROM:Niveloft <onboarding@resend.dev>}
    reply-to: ${EMAIL_REPLY_TO:}
    api-url: ${EMAIL_API_URL:https://api.resend.com/emails}
    # Email people each time their account is signed in to.
    sign-in-alerts: ${EMAIL_SIGN_IN_ALERTS:true}
  accounts:
    # auto: new accounts must confirm their email when emails are really delivered (EMAIL_PROVIDER=resend).
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:auto}
    registration-open: ${REGISTRATION_OPEN:true}
  bot-protection:
    # Per-address limits on sign-up, sign-in and emailed links. Only tests turn this off.
    rate-limits: ${RATE_LIMITS:true}
    # Cloudflare Turnstile secret key (optional). Set VITE_TURNSTILE_SITE_KEY on the frontend too.
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
    turnstile-verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    # Proxies in front of this server that add to X-Forwarded-For (1 on Railway/Render; 0 without a proxy).
    trusted-proxies: ${TRUSTED_PROXIES:1}
  https:
    # Redirect plain HTTP to HTTPS (the host's proxy must send X-Forwarded-Proto). HSTS is always
    # sent on HTTPS responses.
    required: ${REQUIRE_HTTPS:false}
  ops:
    # API limits. 0 turns one off. Over a rate limit the answer is 429 with Retry-After.
    limits:
      requests-per-minute: ${API_REQUESTS_PER_MINUTE:300}       # per signed-in person
      anonymous-requests-per-minute: ${API_ANONYMOUS_PER_MINUTE:120}  # per IP address, without sign-in
      writes-per-minute: ${API_WRITES_PER_MINUTE:60}            # changes per person
      uploads-per-hour: ${API_UPLOADS_PER_HOUR:60}              # file uploads per person
      max-json-kb: ${API_MAX_JSON_KB:512}                       # largest JSON request body
      max-tasks-per-project: ${MAX_TASKS_PER_PROJECT:5000}
      max-projects-per-user: ${MAX_PROJECTS_PER_USER:100}
      max-members-per-project: ${MAX_MEMBERS_PER_PROJECT:200}
      storage-mb-per-project: ${STORAGE_MB_PER_PROJECT:1024}   # uploaded evidence per project
    # Spending caps on paid services, for the whole server. 0 turns one off.
    spending:
      ai-requests-per-day: ${AI_MAX_REQUESTS_PER_DAY:1000}
      ai-tokens-per-month: ${AI_MAX_TOKENS_PER_MONTH:5000000}
      emails-per-day: ${EMAIL_MAX_PER_DAY:100}
      emails-per-month: ${EMAIL_MAX_PER_MONTH:3000}
  billing:
    # Paid plans are paid by UPI straight to this UPI ID; an operator confirms each payment by its
    # UTR (Admin → Payments). Prices and limits are in billing/Plan.java.
    upi-id: ${BILLING_UPI_ID:dobhalaaryam-2@okhdfcbank}
    # The name UPI apps show next to the UPI ID.
    payee-name: ${BILLING_PAYEE_NAME:Niveloft}
    # Plan limits (Free: 3 active projects and 5 people per project; Pro: 15 people; Team: 50).
    enforce-limits: ${BILLING_ENFORCE_LIMITS:true}
  operators:
    # Email addresses (comma-separated) of the people who run this site. Their accounts can open
    # Site health: form success rates, sign-up sources, contact messages and spending. Nobody when empty.
    # They also approve UPI payments (Admin → Payments).
    emails: ${OPERATOR_EMAILS:dobhalaaryam@gmail.com}
  ai:
    # auto (default): use a free Ollama model on this computer if one is running, found automatically.
    # ollama | openai (Groq, Gemini, OpenRouter, …) | anthropic | none. See README "AI providers".
    provider: ${AI_PROVIDER:auto}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:}
    max-requests-per-hour: ${AI_MAX_REQUESTS_PER_HOUR:30}
